<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Controller</title>
<style>
  :root {
    --bg:#0d1117; --card:#161b22; --card2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#80e2e5; --accent-dim:#4a8385;
    --danger:#f85149; --ok:#3fb950; --amber:#d29922;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0 auto; max-width:520px; padding:16px;
    font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .card { background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px; }
  .card-h { font-size:16px; font-weight:700; margin:0 0 12px; }

  /* Card 1 */
  .conn-top { display:flex; align-items:center; gap:20px; margin-bottom:14px; }
  .stat { display:flex; align-items:center; gap:8px; font-size:14px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--danger); flex:none; }
  .dot.on { background:var(--ok); }
  .dot.connecting { background:var(--amber); animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .bars { display:inline-flex; gap:2px; align-items:flex-end; height:14px; }
  .bars i { width:3px; background:var(--border); border-radius:1px; }
  .bars i:nth-child(1){height:5px} .bars i:nth-child(2){height:8px}
  .bars i:nth-child(3){height:11px} .bars i:nth-child(4){height:14px}
  .bars i.lit { background:var(--accent); }
  #sigLabel { font-size:12px; color:var(--muted); min-width:40px; }
  .err { font-size:12px; color:var(--danger); margin-top:8px; min-height:16px; }
  button { font-family:inherit; font-size:15px; font-weight:600; border:none;
    border-radius:10px; padding:12px 16px; color:#0d1117; background:var(--accent);
    cursor:pointer; transition:transform .08s, filter .1s; }
  button:active { transform:scale(.96); filter:brightness(.9); }
  button:disabled { opacity:.5; cursor:default; }
  .wide { width:100%; }
  .btn-sec { background:var(--border); color:var(--text); }

  /* Card 2 + 3 side by side 1:4 */
  .row24 { display:flex; gap:14px; align-items:stretch; margin-bottom:14px; }
  .row24 .card { margin-bottom:0; }
  .disconnected-dim { opacity:.35; pointer-events:none; transition:opacity .2s; }
  .lights-card { flex:1; display:flex; flex-direction:column; padding:14px 8px; }
  .lights-card .card-h { text-align:center; }
  .qa-card { flex:4; }
  .toggle-wrap { flex:1; display:flex; align-items:center; justify-content:center; }
  .toggle { position:relative; width:46px; height:108px; background:var(--card2);
    border:1px solid var(--border); border-radius:24px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:7px 0; align-items:center; }
  .toggle .lbl { font-size:10px; color:var(--muted); z-index:2; }
  .toggle .knob { position:absolute; left:5px; width:36px; height:36px; border-radius:50%;
    background:var(--accent); transition:top .2s ease; top:5px; }
  .toggle.off .knob { top:calc(100% - 41px); background:var(--muted); }
  .quick { display:flex; flex-direction:column; gap:10px; }
  .qbtn { position:relative; overflow:hidden; background:var(--card2);
    color:var(--text); border:1px solid var(--border);
    font-size:18px; font-weight:600; padding:12px; border-radius:10px; }
  .qbtn .ql { position:relative; z-index:2; }
  .qbtn.selected { background:var(--accent); color:#0d1117; border-color:var(--accent); }

  /* Level 2 shimmer */
  .live::after {
    content:''; position:absolute; top:0; left:-50%; width:55%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    z-index:1; animation:sweep 1.4s linear infinite; pointer-events:none;
  }
  @keyframes sweep { from{left:-50%} to{left:130%} }

  /* Card 3: Tuning */
  .tuning-card { transition:opacity .2s; }
  .tuning-card.disabled { opacity:.35; pointer-events:none; }
  .tuning-header { display:flex; align-items:center; justify-content:space-between; margin:0 0 14px; gap:10px; }
  .tuning-who { font-size:16px; color:var(--text); font-weight:700; margin:0; }
  .reset-btn { flex:none; width:32px; height:32px; padding:0; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:1px solid var(--border); color:var(--muted); }
  .reset-btn svg { display:block; transition:transform .5s ease; }
  .reset-btn.spin svg { transform:rotate(-360deg); }
  .reset-btn.flash { color:var(--accent); border-color:var(--accent); background:rgba(128,226,229,.12); }
  .divider { height:1px; background:var(--border); margin:14px 0; }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  .field.hidden { display:none; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .val { float:right; color:var(--accent); font-weight:600; }
  input[type=range], input[type=color], select { width:100%; font-family:inherit; }
  input[type=color] { height:50px; border:none; border-radius:10px;
    background:none; padding:0; cursor:pointer; }
  input[type=range] { height:30px; -webkit-appearance:none; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:var(--border); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px;
    border-radius:50%; background:var(--accent); margin-top:-7px; }

  .stamp { text-align:center; color:var(--muted); font-size:12px; margin:20px 0 8px; }
</style>
</head>
<body>

<!-- ── CARD 1: Connection ─────────────────────────────── -->
<div class="card">
  <div class="conn-top">
    <div class="stat">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
    <div class="stat">
      <span class="bars" id="bars"><i></i><i></i><i></i><i></i></span>
      <span id="sigLabel"></span>
    </div>
  </div>
  <button class="wide" id="connBtn" onclick="toggleConnect()">Connect</button>
  <div class="err" id="errMsg"></div>
</div>

<!-- ── CARD 2 (Lights) + CARD 3 (Patterns) ────────────── -->
<div class="row24 disconnected-dim" id="row24">
  <div class="card lights-card">
    <div class="card-h">Lights</div>
    <div class="toggle-wrap">
      <div class="toggle" id="toggle" onclick="toggleLights()">
        <span class="lbl">On</span><span class="lbl">Off</span>
        <span class="knob"></span>
      </div>
    </div>
  </div>
  <div class="card qa-card">
    <div class="card-h" style="text-align:center">Patterns</div>
    <div class="quick">
      <button class="qbtn" onclick="selectQA(0,this)"><span class="ql">Solid</span></button>
      <button class="qbtn" onclick="selectQA(1,this)"><span class="ql">Breathe</span></button>
      <button class="qbtn" onclick="selectQA(2,this)"><span class="ql">Waves</span></button>
      <button class="qbtn" onclick="selectQA(3,this)"><span class="ql">Rainbow</span></button>
    </div>
  </div>
</div>

<!-- ── CARD 4: Tuning ─────────────────────────────────── -->
<div class="card tuning-card disabled" id="tuningCard">

  <!-- Universal: always shown, persists across Default switches -->
  <div class="tuning-header">
    <div class="tuning-who" id="tuningWho">Select a pattern to begin</div>
    <button class="reset-btn" id="resetBtn" onclick="resetPattern()" title="Reset to default" aria-label="Reset to default">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <polyline points="3 3 3 8 8 8"/>
      </svg>
    </button>
  </div>

  <div class="field" id="fColor" data-qa="0,1,2">
    <label>Color</label>
    <input type="color" id="qaColor" value="#80e2e5" oninput="onQAColor(this.value)">
  </div>

  <!-- Divider between universal and pattern-specific -->
  <div class="divider" id="patDivider" style="display:none"></div>

  <!-- Solid (0) specific: Brightness -->
  <div class="field hidden" data-qa="0,3" id="fSolidBr">
    <label>Brightness <span class="val" id="vSolidBr">30%</span></label>
    <input type="range" min="0" max="100" value="30"
           oninput="onPct('BRIGHT','vSolidBr',this.value)"
           onchange="sendNow('BRIGHT',this.value)">
  </div>

  <!-- Default 2 (Breathe) specific -->
  <div class="field hidden" data-qa="1" id="fMinBr">
    <label>Min Brightness <span class="val" id="vMinBr">10%</span></label>
    <input type="range" min="0" max="100" value="10"
           oninput="onPct('MINBR','vMinBr',this.value)"
           onchange="sendNow('MINBR',this.value)">
  </div>

  <div class="field hidden" data-qa="1" id="fMaxBr">
    <label>Max Brightness <span class="val" id="vMaxBr">30%</span></label>
    <input type="range" min="0" max="100" value="30"
           oninput="onPct('MAXBR','vMaxBr',this.value)"
           onchange="sendNow('MAXBR',this.value)">
  </div>

  <!-- Default 3 (Waves) specific: Master Brightness (scales base + trail proportionally) -->
  <div class="field hidden" data-qa="2" id="fWaveMaster">
    <label>Master Brightness <span class="val" id="vWaveMaster">100%</span></label>
    <input type="range" min="0" max="100" value="100"
           oninput="onPct('WAVEBRIGHT','vWaveMaster',this.value)"
           onchange="sendNow('WAVEBRIGHT',this.value)">
  </div>

  <!-- Default 3 (Waves) specific: Peak Brightness (brightness at head of trail) -->
  <div class="field hidden" data-qa="2" id="fWaveBr">
    <label>Peak Brightness <span class="val" id="vWaveBr">25%</span></label>
    <input type="range" min="0" max="100" value="25"
           oninput="onPct('BRIGHT','vWaveBr',this.value)"
           onchange="sendNow('BRIGHT',this.value)">
  </div>

  <!-- Default 2 + 3 + 4 (Breathe + Waves + Rainbow) -->
  <div class="field hidden" data-qa="1,2,3" id="fSpd">
    <label>Speed <span class="val" id="vSpd">0%</span></label>
    <input type="range" min="-5" max="5" value="0" step="1"
           oninput="onSpd(this.value)" onchange="sendNow('SPD',this.value)">
  </div>

  <!-- Default 4 (Rainbow) specific: independent hue-cycling speed -->
  <div class="field hidden" data-qa="3" id="fRainbowSpd">
    <label>Rainbow Speed <span class="val" id="vRainbowSpd">0%</span></label>
    <input type="range" min="-5" max="5" value="0" step="1"
           oninput="onRainbowSpd(this.value)" onchange="sendNow('HUESPD',this.value)">
  </div>

  <!-- Default 3 (Waves): Base Brightness (renamed from Base Glow) -->
  <div class="field hidden" data-qa="2" id="fBase">
    <label>Base Brightness <span class="val" id="vBase">15%</span></label>
    <input type="range" min="25" max="100" value="15"
           oninput="onPct('BASE','vBase',this.value)"
           onchange="sendNow('BASE',this.value)">
  </div>

  <div class="field hidden" data-qa="2" id="fTrail">
    <label>Trail Length <span class="val" id="vTrail">20</span></label>
    <input type="range" min="1" max="30" value="20"
           oninput="onSlide('TRAIL','vTrail',this.value)"
           onchange="sendNow('TRAIL',this.value)">
  </div>

</div>

<div class="stamp">Last updated: 2026-08-03 13:15 UTC</div>

<script>
// ── BLE UUIDs ──────────────────────────────────────────
const SVC   = '12345678-1234-5678-1234-56789abcdef0';
const CHAR  = '12345678-1234-5678-1234-56789abcdef1';
const RSSI  = '12345678-1234-5678-1234-56789abcdef2';
const STATE = '12345678-1234-5678-1234-56789abcdef3';

// ── STATE ──────────────────────────────────────────────
let characteristic = null;
let device         = null;
let lightsOn       = true;
let activeQA       = -1;     // which QA is selected (-1 = none)
let activeQAEl     = null;   // the button element
let stateCharacteristic = null;   // kept live so we can re-sync sliders after switching patterns

// universal values (persist across QA switches)
let uniColor  = '#80e2e5';

// per-QA pattern-specific defaults (shown when switching to that QA)
// Fallback only — used to populate the tuning panel if a live read from the
// device fails right after switching patterns. The real values always come
// from the firmware (see the DEFAULT TUNING VALUES block in the .ino) via
// syncStateFromDevice(); these numbers are not guaranteed to match the
// firmware's current #define values and should not be relied on.
const QA_DEFAULTS = {
  0: { solidbr:30 },                          // Solid: brightness
  1: { minbr:10, maxbr:30, spd:0 },           // Breathe
  2: { wavemaster:100, wavebr:25, base:15, spd:0, trail:20 }, // Waves
  3: { solidbr:25, spd:0, rainbowspd:0 }                      // Rainbow
};

// ── HELPERS ────────────────────────────────────────────
function q(s)  { return document.querySelector(s); }
function qa(s) { return document.querySelectorAll(s); }

// ── BLE SEND ───────────────────────────────────────────
async function send(str) {
  if (!characteristic) return;
  try { await characteristic.writeValue(new TextEncoder().encode(str)); }
  catch(e) { console.error('Send failed:', e); }
}

let pending={}, debTimer=null;
function qSend(cmd,val){ pending[cmd]=val; if(!debTimer) debTimer=setTimeout(flush,40); }
function flush(){ for(const c in pending) send(c+':'+pending[c]); pending={}; debTimer=null; }
function sendNow(cmd,val){ pending[cmd]=val; flush(); }

// ── CONNECTION ─────────────────────────────────────────
async function toggleConnect() {
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  if (!navigator.bluetooth) { showErr('Web Bluetooth not supported — use Chrome'); return; }
  try {
    showErr('');
    setConnState('connecting');
    device = await navigator.bluetooth.requestDevice({
      filters:[{services:[SVC]},{name:'ESP32-LED'},{namePrefix:'ESP32'}],
      optionalServices:[SVC]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    characteristic = await service.getCharacteristic(CHAR);
    try {
      const rc = await service.getCharacteristic(RSSI);
      await rc.startNotifications();
      rc.addEventListener('characteristicvaluechanged', onRssi);
    } catch(e) { console.log('RSSI not available'); }
    // Read current state from ESP32 and sync UI. This is what makes the
    // Lights toggle and pattern buttons match reality on connect, so it's
    // worth one retry rather than silently leaving the UI on its default
    // (On / no pattern) if the first read hits a transient BLE hiccup.
    try {
      stateCharacteristic = await service.getCharacteristic(STATE);
      await syncStateFromDevice();
    } catch(e) { console.log('State sync failed:', e); }
    setConnState('connected');
  } catch(e) {
    const msg = e.message || String(e);
    if      (msg.includes('cancel'))  showErr('');
    else if (msg.includes('busy'))    showErr('Device busy');
    else if (msg.includes('found'))   showErr('No device found');
    else                              showErr('Connect failed');
    setConnState('disconnected');
  }
}

// Reads the STATE characteristic and applies it to the UI, retrying once
// after a short delay if the first attempt fails (e.g. the peripheral
// wasn't quite ready yet). This is the single source of truth for slider
// values — it always reflects whatever the firmware is actually running,
// including the #define defaults baked in at boot, so the sliders never
// drift out of sync with the .ino.
async function syncStateFromDevice() {
  if (!stateCharacteristic) return;
  let stateStr;
  try {
    const val = await stateCharacteristic.readValue();
    stateStr = new TextDecoder().decode(val);
  } catch(e) {
    console.log('First state read failed, retrying:', e);
    await new Promise(r => setTimeout(r, 300));
    const val = await stateCharacteristic.readValue();
    stateStr = new TextDecoder().decode(val);
  }
  console.log('Synced state from device:', stateStr);
  applyState(stateStr);
}

function onDisconnect() {
  characteristic = null;
  stateCharacteristic = null;
  setConnState('disconnected');
}

function setConnState(s) {
  const dot=q('#statusDot'), txt=q('#statusText'), btn=q('#connBtn');
  dot.className='dot';
  if (s==='disconnected') {
    txt.textContent='Disconnected'; btn.textContent='Connect'; btn.disabled=false;
    qa('#bars i').forEach(i=>i.classList.remove('lit'));
    q('#sigLabel').textContent='';
    // dim cards 2+ and strip shimmer animation
    q('#row24').classList.add('disconnected-dim');
    q('#tuningCard').classList.add('disconnected-dim');
    qa('.qbtn').forEach(b=>b.classList.remove('live'));
  } else if (s==='connecting') {
    dot.classList.add('connecting'); txt.textContent='Connecting…';
    btn.textContent='Connecting…'; btn.disabled=true;
  } else {
    dot.classList.add('on'); txt.textContent='Connected';
    btn.textContent='Disconnect'; btn.disabled=false;
    qa('#bars i').forEach((i,n)=>{ if(n<3) i.classList.add('lit'); });
    // enable cards 2+
    q('#row24').classList.remove('disconnected-dim');
    q('#tuningCard').classList.remove('disconnected-dim');
  }
}

function showErr(msg) { q('#errMsg').textContent=msg; }

function onRssi(ev) {
  const rssi=parseInt(new TextDecoder().decode(ev.target.value).trim());
  if (isNaN(rssi)) return;
  const b = rssi>=-55?4:rssi>=-67?3:rssi>=-78?2:rssi>=-88?1:0;
  qa('#bars i').forEach((i,n)=>{ i.classList.toggle('lit', n<b); });
  q('#sigLabel').textContent = b>=3 ? 'High' : b>=2 ? 'Medium' : 'Low';
}

// ── LIGHTS TOGGLE ──────────────────────────────────────
function toggleLights() {
  const t=q('#toggle'); t.classList.toggle('off');
  lightsOn=!t.classList.contains('off');
  send(lightsOn ? 'ON' : 'OFF');
  paint();
}

// ── QUICK ACCESS SELECTION ─────────────────────────────
async function selectQA(idx, btn) {
  activeQA   = idx;
  activeQAEl = btn;

  // run this QA effect on firmware
  await send('QA:'+idx);

  // re-apply universal color immediately
  send('QACOLOR:'+uniColor.replace('#',''));

  // show the tuning panel
  q('#tuningCard').classList.remove('disabled');
  q('#tuningWho').textContent = ['Solid','Breathe','Waves','Rainbow'][idx];

  // show/hide pattern-specific fields
  qa('.field[data-qa]').forEach(f=>{
    const targets = f.dataset.qa.split(',').map(Number);
    f.classList.toggle('hidden', !targets.includes(idx));
  });

  // show divider — all three patterns now have at least one specific control
  q('#patDivider').style.display = '';

  // pull this pattern's actual current values (the .ino's #define defaults,
  // or whatever was tuned earlier this session) straight from the device
  try {
    await syncStateFromDevice();
  } catch(e) {
    console.log('Could not sync from device, falling back to placeholder defaults:', e);
    const def = QA_DEFAULTS[idx] || {};
    if (def.wavemaster !== undefined){ q('#fWaveMaster input').value=def.wavemaster; q('#vWaveMaster').textContent=def.wavemaster+'%'; }
    if (def.solidbr !== undefined){ q('#fSolidBr input').value=def.solidbr; q('#vSolidBr').textContent=def.solidbr+'%'; }
    if (def.minbr   !== undefined){ q('#fMinBr input').value=def.minbr;    q('#vMinBr').textContent=def.minbr+'%'; }
    if (def.maxbr   !== undefined){ q('#fMaxBr input').value=def.maxbr;    q('#vMaxBr').textContent=def.maxbr+'%'; }
    if (def.wavebr  !== undefined){ q('#fWaveBr input').value=def.wavebr;  q('#vWaveBr').textContent=def.wavebr+'%'; }
    if (def.spd     !== undefined){ q('#fSpd input').value=def.spd;        q('#vSpd').textContent='0%'; }
    if (def.base    !== undefined){ q('#fBase input').value=def.base;      q('#vBase').textContent=def.base+'%'; }
    if (def.trail   !== undefined){ q('#fTrail input').value=def.trail;    q('#vTrail').textContent=def.trail; }
    if (def.rainbowspd !== undefined){ q('#fRainbowSpd input').value=def.rainbowspd; q('#vRainbowSpd').textContent='0%'; }
    paint();
  }
}

// ── RESET TO DEFAULT ────────────────────────────────────
async function resetPattern() {
  if (activeQA < 0) return;  // no pattern selected yet, nothing to reset

  await send('RESET');

  // button effect: spin the icon + flash accent color, then settle back
  const btn = q('#resetBtn');
  btn.classList.remove('spin');
  void btn.offsetWidth;  // restart animation if pressed again quickly
  btn.classList.add('spin', 'flash');
  setTimeout(() => btn.classList.remove('spin', 'flash'), 500);

  // firmware has now restored this pattern's defaults — pull the real
  // values back so every slider (and the color swatch) reflects them
  try { await syncStateFromDevice(); }
  catch(e) { console.log('Reset sync failed:', e); }
}

// ── PAINT ──────────────────────────────────────────────
function paint() {
  qa('.qbtn').forEach(b=>b.classList.remove('selected','live'));
  if (activeQAEl) {
    activeQAEl.classList.add('selected');
    if (lightsOn) activeQAEl.classList.add('live');
  }
}

// ── UNIVERSAL TUNING ───────────────────────────────────
function onQAColor(hex) {
  uniColor = hex;
  qSend('QACOLOR', hex.replace('#',''));
}

// ── PATTERN-SPECIFIC TUNING ────────────────────────────
function onPct(cmd, labelId, val) {
  q('#'+labelId).textContent = val+'%';
  qSend(cmd, val);
}

function onSpd(val) {
  const v = parseInt(val);
  q('#vSpd').textContent = v===0 ? '0%' : (v>0?'+':'')+(v*10)+'%';
  qSend('SPD', val);
}

function onRainbowSpd(val) {
  const v = parseInt(val);
  q('#vRainbowSpd').textContent = v===0 ? '0%' : (v>0?'+':'')+(v*10)+'%';
  qSend('HUESPD', val);
}

function onSlide(cmd, labelId, val) {
  q('#'+labelId).textContent = val;
  qSend(cmd, val);
}

// ── STATE SYNC (called once on connect) ────────────────
// Parses "QA:N,ON:0/1,COLOR:RRGGBB,BRIGHT:pct,..." from ESP32
// and updates the entire UI to match what's actually running.
function applyState(stateStr) {
  // parse "KEY:VAL,KEY:VAL,..." into an object
  const s = {};
  stateStr.split(',').forEach(pair => {
    const [k, v] = pair.split(':');
    if (k && v !== undefined) s[k.trim()] = v.trim();
  });

  // lights on/off
  if (s.ON !== undefined) {
    lightsOn = s.ON === '1';
    const t = q('#toggle');
    if (lightsOn) t.classList.remove('off');
    else          t.classList.add('off');
  }

  // color
  if (s.COLOR) {
    uniColor = '#' + s.COLOR.toLowerCase();
    q('#qaColor').value = uniColor;
  }

  // select the running QA button (without sending QA command back)
  if (s.QA !== undefined) {
    const idx = parseInt(s.QA);
    const btns = qa('.qbtn');
    if (idx >= 0 && idx < btns.length) {
      activeQA   = idx;
      activeQAEl = btns[idx];

      // show tuning panel and correct fields
      q('#tuningCard').classList.remove('disabled');
      q('#tuningWho').textContent = ['Solid','Breathe','Waves','Rainbow'][idx];
      qa('.field[data-qa]').forEach(f => {
        const targets = f.dataset.qa.split(',').map(Number);
        f.classList.toggle('hidden', !targets.includes(idx));
      });
      q('#patDivider').style.display = '';

      // apply synced values to sliders
      const br   = parseInt(s.BRIGHT) || 0;
      const base = parseInt(s.BASE)   || 0;
      const minb = parseInt(s.MINBR)  || 0;
      const maxb = parseInt(s.MAXBR)  || 0;
      const spd  = parseInt(s.SPD)    || 0;
      const trail= parseInt(s.TRAIL)  || 6;
      const wb   = parseInt(s.WBRIGHT)|| 100;
      const rspd = parseInt(s.RSPD)   || 0;

      // Solid
      q('#fSolidBr input').value = br;   q('#vSolidBr').textContent = br + '%';
      // Breathe
      q('#fMinBr input').value = minb;   q('#vMinBr').textContent = minb + '%';
      q('#fMaxBr input').value = maxb;   q('#vMaxBr').textContent = maxb + '%';
      // Waves
      q('#fWaveMaster input').value = wb; q('#vWaveMaster').textContent = wb + '%';
      q('#fWaveBr input').value = br;    q('#vWaveBr').textContent = br + '%';
      q('#fBase input').value = base;    q('#vBase').textContent = base + '%';
      q('#fTrail input').value = trail;  q('#vTrail').textContent = trail;
      // Shared (Breathe + Waves + Rainbow)
      q('#fSpd input').value = spd;
      q('#vSpd').textContent = spd === 0 ? '0%' : (spd > 0 ? '+' : '') + (spd * 10) + '%';
      // Rainbow-only
      q('#fRainbowSpd input').value = rspd;
      q('#vRainbowSpd').textContent = rspd === 0 ? '0%' : (rspd > 0 ? '+' : '') + (rspd * 10) + '%';
    }
  }

  paint();
}

// ── INIT ───────────────────────────────────────────────
setConnState('disconnected');
paint();
</script>
</body>
</html>
