<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Controller</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #80e2e5;
    --accent-dim: #4a8385;
    --danger: #f85149;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .dot.on { background: var(--accent); }
  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; padding: 12px 16px;
    color: #0d1117; background: var(--accent); cursor: pointer;
    transition: opacity .15s;
  }
  button:active { opacity: .7; }
  button.secondary { background: var(--border); color: var(--text); }
  button.wide { width: 100%; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
  .val { color: var(--accent); font-weight: 600; float: right; }
  input[type=range] {
    width: 100%; height: 32px; -webkit-appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: var(--border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); margin-top: -8px; cursor: pointer;
  }
  input[type=color] {
    width: 100%; height: 60px; border: none; border-radius: 10px;
    background: none; cursor: pointer; padding: 0;
  }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset-slot { text-align: center; }
  .preset-slot .num { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .preset-slot button { width: 100%; padding: 10px 4px; font-size: 13px; }
  .mini { font-size: 11px; padding: 8px 4px; }
  .toggle-row { display: flex; gap: 10px; }
  .toggle-row button { flex: 1; }
  .off-btn { background: var(--danger); }
  .disabled { opacity: .4; pointer-events: none; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>

<h1>LED Controller</h1>
<div class="sub">WS2812B · Ring + Strip + Ring</div>

<div class="card">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Not connected</span>
  </div>
  <button class="wide" id="connectBtn" onclick="connect()">Connect to ESP32-LED</button>
</div>

<div id="controls" class="disabled">

  <div class="card">
    <div class="toggle-row">
      <button id="onBtn" onclick="send('ON')">Lights ON</button>
      <button class="off-btn" id="offBtn" onclick="send('OFF')">Lights OFF</button>
    </div>
    <button class="secondary wide" style="margin-top:10px" onclick="resetAll()">Reset to Defaults</button>
  </div>

  <div class="card">
    <div class="section-title">Color</div>
    <input type="color" id="color" value="#80e2e5"
           oninput="onColor(this.value)">
  </div>

  <div class="card">
    <div class="section-title">Tuning</div>

    <label>Brightness <span class="val" id="brightVal">60</span></label>
    <input type="range" min="1" max="255" value="60"
           oninput="onSlide('BRIGHT', this.value, 'brightVal')">

    <label>Base glow <span class="val" id="baseVal">30</span></label>
    <input type="range" min="0" max="255" value="30"
           oninput="onSlide('BASE', this.value, 'baseVal')">

    <label>Strip speed <span class="val" id="stripVal">2</span></label>
    <input type="range" min="1" max="20" value="2"
           oninput="onSlideInv('STRIPSPD', this.value, 'stripVal')">

    <label>Ring speed <span class="val" id="ringVal">2</span></label>
    <input type="range" min="1" max="20" value="2"
           oninput="onSlideInv('RINGSPD', this.value, 'ringVal')">

    <label>Wave width <span class="val" id="pulseVal">4</span></label>
    <input type="range" min="1" max="20" value="4"
           oninput="onSlide('PULSEW', this.value, 'pulseVal')">

    <label>Ring trail <span class="val" id="trailVal">6</span></label>
    <input type="range" min="1" max="30" value="6"
           oninput="onSlide('TRAIL', this.value, 'trailVal')">
  </div>

  <div class="card">
    <div class="section-title">Presets</div>
    <div class="presets">
      <!-- 6 slots -->
      <div class="preset-slot"><div class="num">Slot 1</div>
        <button onclick="send('LOAD:0')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:0')">Save</button></div>
      <div class="preset-slot"><div class="num">Slot 2</div>
        <button onclick="send('LOAD:1')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:1')">Save</button></div>
      <div class="preset-slot"><div class="num">Slot 3</div>
        <button onclick="send('LOAD:2')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:2')">Save</button></div>
      <div class="preset-slot"><div class="num">Slot 4</div>
        <button onclick="send('LOAD:3')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:3')">Save</button></div>
      <div class="preset-slot"><div class="num">Slot 5</div>
        <button onclick="send('LOAD:4')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:4')">Save</button></div>
      <div class="preset-slot"><div class="num">Slot 6</div>
        <button onclick="send('LOAD:5')">Load</button>
        <button class="secondary mini" onclick="send('SAVE:5')">Save</button></div>
    </div>
  </div>

</div>

<script>
const SERVICE_UUID = '12345678-1234-5678-1234-56789abcdef0';
const CHAR_UUID    = '12345678-1234-5678-1234-56789abcdef1';

let characteristic = null;
let device = null;

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const controls = document.getElementById('controls');
const connectBtn = document.getElementById('connectBtn');

async function connect() {
  if (!navigator.bluetooth) {
    alert('Web Bluetooth not supported. Use Chrome on Android.');
    return;
  }
  try {
    statusText.textContent = 'Scanning…';
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'ESP32-LED' }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);

    statusText.textContent = 'Connecting…';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    dot.classList.add('on');
    statusText.textContent = 'Connected';
    controls.classList.remove('disabled');
    connectBtn.textContent = 'Disconnect';
    connectBtn.onclick = disconnect;
  } catch (e) {
    statusText.textContent = 'Failed: ' + e.message;
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

function onDisconnect() {
  characteristic = null;
  dot.classList.remove('on');
  statusText.textContent = 'Disconnected';
  controls.classList.add('disabled');
  connectBtn.textContent = 'Connect to ESP32-LED';
  connectBtn.onclick = connect;
}

async function send(str) {
  if (!characteristic) return;
  try {
    await characteristic.writeValue(new TextEncoder().encode(str));
  } catch (e) {
    console.error('Send failed:', e);
  }
}

// color picker -> COLOR:rrggbb (strip the #)
function onColor(hex) {
  send('COLOR:' + hex.replace('#', ''));
}

// default values — must match the firmware Settings struct
const DEFAULTS = {
  color: '#80e2e5',
  BRIGHT: 60, brightVal: 'brightVal',
  BASE: 30,   baseVal: 'baseVal',
  STRIPSPD: 2, stripVal: 'stripVal',
  RINGSPD: 2,  ringVal: 'ringVal',
  PULSEW: 4,   pulseVal: 'pulseVal',
  TRAIL: 6,    trailVal: 'trailVal'
};

// reset firmware AND snap every on-screen control back to defaults
function resetAll() {
  send('RESET');   // firmware restores its Settings() defaults

  // sync the UI so sliders/color match what the firmware just reset to
  const sliders = document.querySelectorAll('input[type=range]');
  const map = [
    ['brightVal', DEFAULTS.BRIGHT],
    ['baseVal',   DEFAULTS.BASE],
    ['stripVal',  DEFAULTS.STRIPSPD],
    ['ringVal',   DEFAULTS.RINGSPD],
    ['pulseVal',  DEFAULTS.PULSEW],
    ['trailVal',  DEFAULTS.TRAIL]
  ];
  sliders.forEach((sl, i) => {
    sl.value = map[i][1];
    document.getElementById(map[i][0]).textContent = map[i][1];
  });
  document.getElementById('color').value = DEFAULTS.color;
}

// generic slider -> CMD:value, and update the label
function onSlide(cmd, value, labelId) {
  document.getElementById(labelId).textContent = value;
  send(cmd + ':' + value);
}

// inverted-feel slider: label shows the raw threshold (higher = slower)
function onSlideInv(cmd, value, labelId) {
  document.getElementById(labelId).textContent = value;
  send(cmd + ':' + value);
}

// throttle: BLE can choke if sliders fire too fast. Debounce sends slightly.
let lastSend = 0;
const origSend = send;
send = function(str) {
  const now = Date.now();
  // always send button commands; lightly throttle rapid slider spam
  if (str.startsWith('COLOR') || /:\d+$/.test(str)) {
    if (now - lastSend < 30) return;
    lastSend = now;
  }
  return origSend(str);
};
</script>
</body>
</html>
