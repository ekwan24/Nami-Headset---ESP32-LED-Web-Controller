<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Controller</title>
<style>
  :root {
    --bg:#0d1117; --card:#161b22; --card2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#80e2e5; --accent-dim:#4a8385;
    --danger:#f85149; --ok:#3fb950; --amber:#d29922;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0 auto; max-width:520px; padding:16px;
    font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .card { background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px; }
  .card-h { font-size:16px; font-weight:700; margin:0 0 12px; }

  /* Card 1: connection */
  .conn-top { display:flex; align-items:center; gap:20px; margin-bottom:14px; }
  .stat { display:flex; align-items:center; gap:8px; font-size:14px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--danger); flex:none; }
  .dot.on { background:var(--ok); }
  .dot.connecting { background:var(--amber); animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .bars { display:inline-flex; gap:2px; align-items:flex-end; height:14px; }
  .bars i { width:3px; background:var(--border); border-radius:1px; }
  .bars i:nth-child(1){height:5px} .bars i:nth-child(2){height:8px}
  .bars i:nth-child(3){height:11px} .bars i:nth-child(4){height:14px}
  .bars i.lit { background:var(--accent); }
  .err { font-size:12px; color:var(--danger); margin-top:8px; min-height:16px; }
  button { font-family:inherit; font-size:15px; font-weight:600; border:none;
    border-radius:10px; padding:12px 16px; color:#0d1117; background:var(--accent);
    cursor:pointer; transition:transform .08s, filter .1s; }
  button:active { transform:scale(.96); filter:brightness(.9); }
  button:disabled { opacity:.5; cursor:default; }
  .wide { width:100%; }
  .btn-sec { background:var(--border); color:var(--text); }

  /* Card 2 + 3 side by side */
  .row24 { display:flex; gap:14px; align-items:stretch; margin-bottom:14px; }
  .row24 .card { margin-bottom:0; }
  .lights-card { flex:1; display:flex; flex-direction:column; padding:14px 8px; }
  .lights-card .card-h { text-align:center; }
  .qa-card { flex:4; }
  .toggle-wrap { flex:1; display:flex; align-items:center; justify-content:center; }
  .toggle { position:relative; width:46px; height:108px; background:var(--card2);
    border:1px solid var(--border); border-radius:24px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between; padding:7px 0; align-items:center; }
  .toggle .lbl { font-size:10px; color:var(--muted); z-index:2; }
  .toggle .knob { position:absolute; left:5px; width:36px; height:36px; border-radius:50%;
    background:var(--accent); transition:top .2s ease; top:5px; }
  .toggle.off .knob { top:calc(100% - 41px); background:var(--muted); }
  .quick { display:flex; flex-direction:column; gap:10px; }
  .qbtn { position:relative; overflow:hidden; background:var(--card2); color:var(--text);
    border:1px solid var(--border); font-size:18px; font-weight:600; padding:12px; border-radius:10px; }
  .qbtn .ql { position:relative; z-index:2; }
  .qbtn.selected { background:var(--accent); color:#0d1117; border-color:var(--accent); }

  /* Level 2 shimmer — only when .live */
  .live::after, .tab.live::after, .run-wide.live::after {
    content:''; position:absolute; top:0; left:-50%; width:55%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    z-index:1; animation:sweep 1.4s linear infinite; pointer-events:none;
  }
  @keyframes sweep { from{left:-50%} to{left:130%} }

  /* Preset tabs */
  .tabs { display:flex; gap:5px; padding:0 6px; margin-bottom:0; position:relative; z-index:3; }
  .tab { position:relative; overflow:hidden;
    background:var(--card); border:1px solid var(--border); border-bottom:none;
    border-radius:8px 8px 0 0; padding:9px 13px; font-size:13px; color:var(--muted);
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:4px; }
  .tab.selected { color:var(--text); background:var(--card2);
    box-shadow:inset 0 3px 0 var(--accent);
    border-bottom:1px solid var(--card2); margin-bottom:-1px; z-index:4; }
  .tab.running { background:var(--accent); color:#0d1117; border-color:var(--accent); }
  .tab.running.selected { box-shadow:inset 0 3px 0 #0d1117; border-bottom-color:var(--accent); }
  .tab .star { color:var(--danger); font-weight:700; position:relative; z-index:2; }
  .tab .tl { position:relative; z-index:2; }

  /* Card 4 */
  .card-tab { border-radius:0 14px 14px 14px; background:var(--card2); position:relative; z-index:1; }
  .segments { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .seg { background:var(--card); border:2px solid var(--border); border-radius:12px;
    padding:16px 8px; text-align:center; font-size:14px; font-weight:600;
    cursor:pointer; line-height:1.3; transition:border-color .15s,background .15s; }
  .seg .sw { width:18px; height:18px; border-radius:50%; margin:8px auto 0;
    border:2px solid rgba(255,255,255,.2); }
  .seg .sp { font-size:11px; color:var(--muted); font-weight:500; margin-top:4px; }
  .seg.active { border-color:var(--accent); background:#10243060; }

  .tuning { background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:16px; }
  .tuning-who { font-size:13px; color:var(--accent); font-weight:600; margin-bottom:12px; }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  .field.hidden { display:none; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .val { float:right; color:var(--accent); font-weight:600; }
  select, input[type=range], input[type=color] { width:100%; font-family:inherit; }
  select { background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:14px; }
  input[type=color] { height:44px; border:none; border-radius:8px; background:none; padding:0; cursor:pointer; }
  input[type=range] { height:30px; -webkit-appearance:none; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:var(--border); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px;
    border-radius:50%; background:var(--accent); margin-top:-7px; }

  /* action buttons */
  .action-row { display:flex; gap:10px; margin-bottom:10px; }
  .abtn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:12px 4px; border-radius:10px; font-size:12px; font-weight:600;
    border:1px solid var(--border); background:var(--card); color:var(--text);
    cursor:pointer; position:relative; overflow:hidden; transition:transform .08s,filter .1s; }
  .abtn:active { transform:scale(.94); filter:brightness(.85); }
  .abtn .ico { font-size:18px; line-height:1; }
  .abtn.saved { background:var(--ok); color:#06210f; border-color:var(--ok); }
  /* Run: always green, shimmer added when running */
  .run-wide { width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; border-radius:10px; font-size:16px; font-weight:700;
    background:var(--ok); color:#06210f; border:1px solid var(--ok);
    cursor:pointer; position:relative; overflow:hidden; transition:transform .08s,filter .1s; }
  .run-wide:active { transform:scale(.98); filter:brightness(.9); }

  .stamp { text-align:center; color:var(--muted); font-size:12px; margin:20px 0 8px; }
</style>
</head>
<body>

<!-- Card 1: Connection -->
<div class="card">
  <div class="conn-top">
    <div class="stat"><span class="dot" id="statusDot"></span> <span id="statusText">Disconnected</span></div>
    <div class="stat"><span class="bars" id="bars"><i></i><i></i><i></i><i></i></span> <span id="signalLabel">Signal</span></div>
  </div>
  <button class="wide" id="connBtn" onclick="toggleConnect()">Connect</button>
  <div class="err" id="errMsg"></div>
</div>

<!-- Card 2 (Lights) + Card 3 (Quick Access), 1:4 -->
<div class="row24">
  <div class="card lights-card">
    <div class="card-h">Lights</div>
    <div class="toggle-wrap">
      <div class="toggle" id="toggle" onclick="toggleLights()">
        <span class="lbl">On</span><span class="lbl">Off</span><span class="knob"></span>
      </div>
    </div>
  </div>
  <div class="card qa-card">
    <div class="card-h">Quick Access</div>
    <div class="quick">
      <button class="qbtn" onclick="runQA(0,this)"><span class="ql">Default 1</span></button>
      <button class="qbtn" onclick="runQA(1,this)"><span class="ql">Default 2</span></button>
      <button class="qbtn" onclick="runQA(2,this)"><span class="ql">Default 3</span></button>
    </div>
  </div>
</div>

<!-- Preset tabs: 5 fixed -->
<div class="tabs" id="tabs">
  <div class="tab selected" onclick="selectTab(this,0)"><span class="tl">Preset 1</span></div>
  <div class="tab" onclick="selectTab(this,1)"><span class="tl">Preset 2</span></div>
  <div class="tab" onclick="selectTab(this,2)"><span class="tl">Preset 3</span></div>
  <div class="tab" onclick="selectTab(this,3)"><span class="tl">Preset 4</span></div>
  <div class="tab" onclick="selectTab(this,4)"><span class="tl">Preset 5</span></div>
</div>

<!-- Card 4: Segments + Tuning -->
<div class="card card-tab">
  <div class="segments">
    <div class="seg active" onclick="selectSeg(0,this)">
      Ring<br>Left<div class="sw" style="background:#80e2e5"></div><div class="sp">Solid</div>
    </div>
    <div class="seg" onclick="selectSeg(1,this)">
      Middle<br>Band<div class="sw" style="background:#80e2e5"></div><div class="sp">Solid</div>
    </div>
    <div class="seg" onclick="selectSeg(2,this)">
      Ring<br>Right<div class="sw" style="background:#80e2e5"></div><div class="sp">Solid</div>
    </div>
  </div>

  <div class="tuning">
    <div class="tuning-who">Tuning — <span id="segName">Ring Left</span> · <span id="presetName" style="color:var(--muted)">Preset 1</span></div>

    <div class="field">
      <label>Pattern</label>
      <select id="patSel" onchange="onPattern(this)">
        <option value="0">Solid</option>
        <option value="1">Breathe</option>
        <option value="2">Waves</option>
      </select>
    </div>

    <div class="field" data-f="color">
      <label>Color</label>
      <input type="color" value="#80e2e5" oninput="onColor(this.value)">
    </div>

    <div class="field" data-f="brightness">
      <label>Brightness <span class="val" id="vBright">60%</span></label>
      <input type="range" min="0" max="100" value="60"
             oninput="onPct('BRIGHT','vBright',this.value)"
             onchange="sendNow('BRIGHT',this.value)">
    </div>

    <div class="field hidden" data-f="minbright">
      <label>Min brightness <span class="val" id="vMinBr">25%</span></label>
      <input type="range" min="0" max="100" value="25"
             oninput="onPct('MINBR','vMinBr',this.value)"
             onchange="sendNow('MINBR',this.value)">
    </div>

    <div class="field hidden" data-f="maxbright">
      <label>Max brightness <span class="val" id="vMaxBr">100%</span></label>
      <input type="range" min="0" max="100" value="100"
             oninput="onPct('MAXBR','vMaxBr',this.value)"
             onchange="sendNow('MAXBR',this.value)">
    </div>

    <div class="field hidden" data-f="baseglow">
      <label>Base glow <span class="val" id="vBase">30%</span></label>
      <input type="range" min="25" max="100" value="30"
             oninput="onPct('BASE','vBase',this.value)"
             onchange="sendNow('BASE',this.value)">
    </div>

    <div class="field hidden" data-f="speed">
      <label>Speed <span class="val" id="vSpd">0%</span></label>
      <input type="range" min="-5" max="5" value="0" step="1"
             oninput="onSpd(this.value)"
             onchange="sendNow('SPD',this.value)">
    </div>

    <div class="field hidden" data-f="trail">
      <label>Trail length <span class="val" id="vTrail">6</span></label>
      <input type="range" min="1" max="30" value="6"
             oninput="onSlide('TRAIL','vTrail',this.value)"
             onchange="sendNow('TRAIL',this.value)">
    </div>
  </div>

  <div class="action-row">
    <div class="abtn" onclick="resetSeg()"><span class="ico">↺</span>Reset</div>
    <div class="abtn" id="saveBtn" onclick="savePres()"><span class="ico" id="saveIco">💾</span><span id="saveLbl">Save</span></div>
  </div>
  <div class="run-wide" id="runBtn" onclick="runPres()">
    <span>▶</span> <span id="runLbl">Run</span>
  </div>
</div>

<div class="stamp">Last updated: 2026-08-02 20:15 UTC</div>

<script>
// ── BLE UUIDs ──────────────────────────────────────────────
const SVC  = '12345678-1234-5678-1234-56789abcdef0';
const CHAR = '12345678-1234-5678-1234-56789abcdef1';
const RSSI = '12345678-1234-5678-1234-56789abcdef2';

// ── STATE ──────────────────────────────────────────────────
let characteristic = null;
let device         = null;
let lightsOn       = true;
let editSeg        = 0;      // 0=RingL, 1=Strip, 2=RingR
let selectedTabIdx = 0;      // which preset tab is shown in Card 4
let selectedTabEl  = null;
let running        = null;   // {type:'qa'|'preset', idx, el}

// pattern attrs shown per pattern
const PAT_FIELDS = {
  0: ['color','brightness'],
  1: ['color','minbright','maxbright','speed'],
  2: ['color','brightness','baseglow','speed','trail']
};

// pattern defaults (for Reset)
const PAT_DEFS = {
  0: { color:'#80e2e5', brightness:60 },
  1: { color:'#80e2e5', minbright:25, maxbright:100, speed:0 },
  2: { color:'#80e2e5', brightness:60, baseglow:30, speed:0, trail:6 }
};

const SEG_NAMES = ['Ring Left','Middle Band','Ring Right'];

// ── HELPERS ────────────────────────────────────────────────
function q(s)  { return document.querySelector(s); }
function qa(s) { return document.querySelectorAll(s); }

// ── BLE SEND ───────────────────────────────────────────────
async function send(str) {
  if (!characteristic) return;
  try { await characteristic.writeValue(new TextEncoder().encode(str)); }
  catch(e) { console.error('Send failed:', e); }
}

let pending={}, debTimer=null;
function qSend(cmd,val){ pending[cmd]=val; if(!debTimer) debTimer=setTimeout(flush,40); }
function flush(){ for(const c in pending) send(c+':'+pending[c]); pending={}; debTimer=null; }
function sendNow(cmd,val){ pending[cmd]=val; flush(); }

// ── CONNECTION ─────────────────────────────────────────────
async function toggleConnect() {
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  if (!navigator.bluetooth) { showErr('Web Bluetooth not supported — use Chrome'); return; }
  try {
    showErr('');
    setConnState('connecting');
    device = await navigator.bluetooth.requestDevice({
      filters:[{services:[SVC]},{name:'ESP32-LED'},{namePrefix:'ESP32'}],
      optionalServices:[SVC]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    characteristic = await service.getCharacteristic(CHAR);
    // subscribe RSSI
    try {
      const rc = await service.getCharacteristic(RSSI);
      await rc.startNotifications();
      rc.addEventListener('characteristicvaluechanged', onRssi);
    } catch(e) { console.log('RSSI not available'); }
    setConnState('connected');
  } catch(e) {
    const msg = e.message || String(e);
    // short messages only (keep status row intact)
    if (msg.includes('cancelled') || msg.includes('cancel')) showErr('');
    else if (msg.includes('busy') || msg.includes('already')) showErr('Device busy');
    else if (msg.includes('found') || msg.includes('found')) showErr('No device found');
    else showErr('Connect failed');
    setConnState('disconnected');
  }
}

function onDisconnect() {
  characteristic = null;
  setConnState('disconnected');
  paint();
}

function setConnState(s) {
  const dot=q('#statusDot'), txt=q('#statusText'), btn=q('#connBtn'), bars=q('#bars');
  dot.className='dot';
  if (s==='disconnected') {
    txt.textContent='Disconnected'; btn.textContent='Connect'; btn.disabled=false;
    bars.querySelectorAll('i').forEach(i=>i.classList.remove('lit'));
    q('#signalLabel').textContent='Signal';
  } else if (s==='connecting') {
    dot.classList.add('connecting'); txt.textContent='Connecting…';
    btn.textContent='Connecting…'; btn.disabled=true;
  } else {
    dot.classList.add('on'); txt.textContent='Connected';
    btn.textContent='Disconnect'; btn.disabled=false;
    bars.querySelectorAll('i').forEach((i,n)=>{ if(n<3) i.classList.add('lit'); });
  }
}

function showErr(msg) { q('#errMsg').textContent=msg; }

function onRssi(ev) {
  const rssi=parseInt(new TextDecoder().decode(ev.target.value).trim());
  if (isNaN(rssi)) return;
  const b = rssi>=-55?4:rssi>=-67?3:rssi>=-78?2:rssi>=-88?1:0;
  q('#signalLabel').textContent='█'.repeat(b)+'░'.repeat(4-b)+' '+rssi+'dBm';
}

// ── LIGHTS TOGGLE ─────────────────────────────────────────
function toggleLights() {
  const t=q('#toggle'); t.classList.toggle('off');
  lightsOn=!t.classList.contains('off');
  send(lightsOn ? 'ON' : 'OFF');
  paint();
}

// ── QUICK ACCESS ──────────────────────────────────────────
function runQA(idx, btn) {
  running={type:'qa', idx, el:btn};
  send('QA:'+idx);
  paint();
}

// ── PRESET TABS ───────────────────────────────────────────
function selectTab(el, idx) {
  selectedTabEl  = el;
  selectedTabIdx = idx;
  q('#presetName').textContent = el.querySelector('.tl').textContent;
  send('SEG:'+editSeg);   // re-sync segment selection with firmware
  paint();
}

function runPres() {
  if (!selectedTabEl) return;
  running={type:'preset', idx:selectedTabIdx, el:selectedTabEl};
  send('RUN:'+selectedTabIdx);
  paint();
}

// ── PAINT: selected + running are independent ─────────────
function paint() {
  qa('.qbtn').forEach(b=>b.classList.remove('selected','live'));
  qa('.tab').forEach(t=>t.classList.remove('running','live','selected'));
  q('#runBtn').classList.remove('live');

  // selected tab (Card 4 display) — always exactly one
  if (selectedTabEl) selectedTabEl.classList.add('selected');

  // running thing — independent
  if (running) {
    if (running.type==='qa') {
      running.el.classList.add('selected');
      if (lightsOn) running.el.classList.add('live');
    } else {
      running.el.classList.add('running');
      if (lightsOn) running.el.classList.add('live');
    }
  }

  // Run button: green always; shimmer only when selected preset = running
  const selIsRun = running && running.type==='preset' && running.el===selectedTabEl;
  q('#runLbl').textContent = selIsRun ? 'Running' : 'Run';
  if (selIsRun && lightsOn) q('#runBtn').classList.add('live');
}

// ── SEGMENT SELECTION ─────────────────────────────────────
function selectSeg(idx, el) {
  qa('.seg').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  editSeg=idx;
  q('#segName').textContent=SEG_NAMES[idx];
  send('SEG:'+idx);
  // sync pattern dropdown to this segment's displayed pattern
  const pat = el.querySelector('.sp').textContent;
  const patIdx = ['Solid','Breathe','Waves'].indexOf(pat);
  if (patIdx>=0) { q('#patSel').value=patIdx; applyPatternFields(patIdx); }
}

// ── PATTERN-AWARE PANEL ───────────────────────────────────
function applyPatternFields(patIdx) {
  const show = PAT_FIELDS[patIdx] || [];
  qa('.tuning .field[data-f]').forEach(f=>{
    f.classList.toggle('hidden', !show.includes(f.dataset.f));
  });
}

function onPattern(sel) {
  const patIdx = parseInt(sel.value);
  applyPatternFields(patIdx);
  // update segment's pattern label
  const activeSeg = q('.seg.active');
  if (activeSeg) activeSeg.querySelector('.sp').textContent=['Solid','Breathe','Waves'][patIdx];
  send('PAT:'+patIdx);
  markDirty();
}

// ── TUNING CONTROLS ───────────────────────────────────────
function onColor(hex) {
  const activeSeg=q('.seg.active');
  if (activeSeg) activeSeg.querySelector('.sw').style.background=hex;
  qSend('COLOR', hex.replace('#',''));
  markDirty();
}

function onPct(cmd, labelId, val) {
  q('#'+labelId).textContent=val+'%';
  qSend(cmd, val);
  markDirty();
}

function onSpd(val) {
  const v=parseInt(val);
  q('#vSpd').textContent=(v===0?'0%':(v>0?'+':'')+(v*10)+'%');
  qSend('SPD', val);
  markDirty();
}

function onSlide(cmd, labelId, val) {
  q('#'+labelId).textContent=val;
  qSend(cmd, val);
  markDirty();
}

// ── DIRTY STATE ───────────────────────────────────────────
function markDirty() {
  if (selectedTabEl && !selectedTabEl.querySelector('.star')) {
    const s=document.createElement('span'); s.className='star'; s.textContent='*';
    selectedTabEl.appendChild(s);
  }
}

// ── SAVE ─────────────────────────────────────────────────
function savePres() {
  const star=selectedTabEl && selectedTabEl.querySelector('.star'); if(star) star.remove();
  send('SAVE:'+selectedTabIdx);
  const btn=q('#saveBtn'); btn.classList.add('saved');
  q('#saveLbl').textContent='Saved'; q('#saveIco').textContent='✓';
  setTimeout(()=>{ btn.classList.remove('saved'); q('#saveLbl').textContent='Save'; q('#saveIco').textContent='💾'; },1000);
}

// ── RESET ─────────────────────────────────────────────────
function resetSeg() {
  const star=selectedTabEl && selectedTabEl.querySelector('.star'); if(star) star.remove();
  const patIdx = parseInt(q('#patSel').value);
  const def = PAT_DEFS[patIdx];
  if (!def) return;

  // color
  if (def.color !== undefined) {
    q('.field[data-f="color"] input').value=def.color;
    const activeSeg=q('.seg.active');
    if (activeSeg) activeSeg.querySelector('.sw').style.background=def.color;
    send('COLOR:'+def.color.replace('#',''));
  }
  // brightness
  if (def.brightness !== undefined) {
    const f=q('.field[data-f="brightness"]');
    f.querySelector('input').value=def.brightness;
    f.querySelector('.val').textContent=def.brightness+'%';
    send('BRIGHT:'+def.brightness);
  }
  // minbright
  if (def.minbright !== undefined) {
    const f=q('.field[data-f="minbright"]');
    f.querySelector('input').value=def.minbright;
    f.querySelector('.val').textContent=def.minbright+'%';
    send('MINBR:'+def.minbright);
  }
  // maxbright
  if (def.maxbright !== undefined) {
    const f=q('.field[data-f="maxbright"]');
    f.querySelector('input').value=def.maxbright;
    f.querySelector('.val').textContent=def.maxbright+'%';
    send('MAXBR:'+def.maxbright);
  }
  // baseglow
  if (def.baseglow !== undefined) {
    const f=q('.field[data-f="baseglow"]');
    f.querySelector('input').value=def.baseglow;
    f.querySelector('.val').textContent=def.baseglow+'%';
    send('BASE:'+def.baseglow);
  }
  // speed
  if (def.speed !== undefined) {
    const f=q('.field[data-f="speed"]');
    f.querySelector('input').value=0;
    f.querySelector('.val').textContent='0%';
    send('SPD:0');
  }
  // trail
  if (def.trail !== undefined) {
    const f=q('.field[data-f="trail"]');
    f.querySelector('input').value=def.trail;
    f.querySelector('.val').textContent=def.trail;
    send('TRAIL:'+def.trail);
  }
}

// ── INIT ──────────────────────────────────────────────────
selectedTabEl = q('.tab.selected');
applyPatternFields(0);   // start with Solid
setConnState('disconnected');
paint();
</script>
